# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
# 多版本平铺（33 线）后并行构建会并发 NFRT/编译 worker 直接 OOM（20G+ 实证）：
# 默认全串行；大内存个人机可在 ~/.gradle/gradle.properties 自行覆盖 parallel=true
org.gradle.parallel=false
# 兜底限制单次调用的 worker 并发（部分任务不经 parallel 开关）
org.gradle.workers.max=2
org.gradle.configuration-cache=true

# Mod metadata (Architectury 时代既有元数据，保留)
mod_version=2.6.6.6
maven_group=rip.ysm
archives_name=openysm
mod_name=OpenYSM
